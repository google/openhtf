# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package to PyPI and TestPyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build OpenHTF distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.13'
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Install build prerequisites
      run: |
        sudo apt-get install -y libusb-1.0-0-dev libprotobuf-dev swig libevent-dev
    - name: Setup protoc
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build a binary wheel and source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish OpenHTF distribution to PyPI
    if: startsWith(github.ref, 'refs/tags')
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openhtf
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.13'
    - name: Authenticate to Google Cloud (OSS Exit Gate)
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
    - name: Clean up failed staging attempt for this exact version (if any)
      id: exit_gate_cleanup
      run: |
        set -euo pipefail
        PKG_VER=$(python3 - <<'PY'
        import email
        import glob
        import tarfile
        import zipfile

        files = sorted(glob.glob("dist/*.whl") + glob.glob("dist/*.tar.gz"))
        assert files, "No distributions found in dist/"
        dist_path = files[0]

        if dist_path.endswith(".whl"):
            with zipfile.ZipFile(dist_path) as zf:
                meta_name = next(
                    n for n in zf.namelist() if n.endswith(".dist-info/METADATA")
                )
                meta_bytes = zf.read(meta_name)
        else:
            with tarfile.open(dist_path) as tf:
                pkg_info = next(
                    m for m in tf.getmembers()
                    if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"
                )
                meta_bytes = tf.extractfile(pkg_info).read()

        print(email.message_from_bytes(meta_bytes)["Version"].strip())
        PY
        )
        echo "pkg_ver=${PKG_VER}" >> "$GITHUB_OUTPUT"
        set +e
        gcloud artifacts versions describe "${PKG_VER}" \
          --package="openhtf" \
          --project="oss-exit-gate-prod" \
          --location="us" \
          --repository="openhtf--pypi" \
          --format="value(name)" > /dev/null 2> describe.err
        DESC_RC=$?
        set -e
        if [ "$DESC_RC" -eq 0 ]; then
          echo "Deleting incomplete staged version ${PKG_VER} before retry..."
          gcloud artifacts versions delete "${PKG_VER}" \
            --package="openhtf" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="openhtf--pypi" \
            --quiet
        elif grep -Eqi "NOT_FOUND|not.found|404" describe.err; then
          echo "Version ${PKG_VER} not present in staging repository — proceeding with fresh upload"
        else
          cat describe.err >&2
          exit "$DESC_RC"
        fi
    - name: Stage distributions to OSS Exit Gate and upload manifest
      env:
        PKG_VER: ${{ steps.exit_gate_cleanup.outputs.pkg_ver }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        python3 -m pip install --upgrade twine
        TWINE_PASSWORD="$(gcloud auth print-access-token)"
        python3 -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/openhtf--pypi/" \
          -u oauth2accesstoken \
          -p "${TWINE_PASSWORD}" \
          dist/*
        cat <<EOF > manifest.json
        {
          "publish_all": false,
          "publishing_groups": [
            {
              "packages": [
                {
                  "name": "openhtf",
                  "version": "${PKG_VER}"
                }
              ]
            }
          ]
        }
        EOF
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/openhtf/pypi/manifests/manifest-${PKG_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"

  publish-to-testpypi:
    name: Publish OpenHTF distribution to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/openhtf

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
