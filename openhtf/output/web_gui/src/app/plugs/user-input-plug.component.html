@if (plugExists()) {
  <div
    class="htf-layout-widget"
    >
    <!-- Wrap contents in an extra div for the background color animation. -->
    <div [@animateIn]="'in'">
      <div class="htf-layout-widget-header">
        <div>Operator input</div>
      </div>
      <div class="htf-layout-widget-body">
        @if (hasImage()) {
          <img [src]="Image_URL" alt="user-input-image">
        }
        <div [innerHTML]="prompt"></div>
        <input
          #response_field
          [style.display]="hasTextInput() ? 'inline' : 'none'"
          [class.user-input-has-error]="error"
          type="text"
          class="u-push-top"
          (keyup.enter)="onEnter(response_field)">
        @if (error) {
          <div class="user-input-error-text u-push-top-third">
            {{ error }}
          </div>
        }
        <div class="u-text-align-right">
          @for (button of buttons; track $index) {
            <button
              type="button"
              class="u-push-top user-input-button"
              [ngClass]="buttonClass(button)"
              [ngStyle]="buttonStyle(button)"
              (click)="sendButtonResponse(response_field, button)">
              {{ button.text }}
            </button>
          } @empty {
            <button
              type="button"
              class="htf-rounded-button-grey u-push-top"
              (click)="sendResponse(response_field)">
              {{ hasTextInput() ? 'Submit' : 'Okay' }}
            </button>
          }
        </div>
      </div>
    </div>
  </div>
}
